name: CI
env:
  DEBUG: napi:*
  APP_NAME: system-ocr
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Select Xcode 26 if available (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macos-latest currently maps to macOS 15 with Xcode 16.4 selected
          # by default. Xcode 26 is pre-installed on the runner image but not
          # selected. Select the newest installed Xcode 26.x so the macOS 26
          # SDK (RecognizeDocumentsRequest) is visible to swiftc and the
          # cargo build below.
          newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest/Contents/Developer"
            echo "Selected $newest"
          else
            echo "No Xcode 26 installation found; falling back to runner default"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-version
      - name: Get Xcode SDK version (macOS)
        id: xcode_sdk
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo unknown)"
          echo "sdk_version=$sdk" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          # On macOS the Swift sidecar output depends on the installed SDK
          # version; bust the cache when the SDK changes so build.rs reruns
          # and re-emits `librecognize_documents.dylib`.
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}${{ runner.os == 'macOS' && format('-sdk{0}', steps.xcode_sdk.outputs.sdk_version) || '' }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Stage Darwin sidecar dylib
        if: contains(matrix.settings.target, 'apple-darwin')
        shell: bash
        run: |
          # build.rs copies the sidecar to the workspace root as a side
          # effect, but cargo may skip rerunning the build script when
          # restoring from cache. Stage the dylib here from the canonical
          # cargo target dir so the artifact-upload step has a stable input
          # regardless of cache state.
          src="target/${{ matrix.settings.target }}/release/librecognize_documents.dylib"
          if [ -f "$src" ]; then
            cp "$src" ./
            echo "Staged sidecar from $src"
            # Validate it matches the build matrix architecture.
            archs="$(lipo -archs librecognize_documents.dylib 2>/dev/null || file librecognize_documents.dylib)"
            echo "sidecar archs: $archs"
          else
            echo "No sidecar at $src (build.rs may have skipped on missing macOS 26 SDK)"
          fi
      - name: Verify Darwin sidecar built (release commits only)
        if: contains(matrix.settings.target, 'apple-darwin')
        shell: bash
        run: |
          # Fail the build early — not the publish — when a release commit
          # produces no Swift sidecar. The publish job also enforces this,
          # but discovering the gap here surfaces a missing macOS 26 SDK or
          # Xcode toolchain immediately for the people running the build.
          msg="$(git log -1 --pretty=%B)"
          if ! echo "$msg" | grep -qE "^v?[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "Not a release commit; sidecar absence is acceptable."
            exit 0
          fi
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo unknown)"
          case "$sdk" in
            26.*) ;;
            *)
              echo "::error::Release commit on ${{ matrix.settings.target }} but selected macOS SDK is $sdk (need 26.x for RecognizeDocumentsRequest). Upgrade the runner image or select Xcode 26."
              exit 1
              ;;
          esac
          if [ ! -f "librecognize_documents.dylib" ]; then
            echo "::error::Release commit on ${{ matrix.settings.target }} produced no librecognize_documents.dylib. The runner needs macOS 26 SDK (Xcode 26+); upgrade the runner image or pin an Xcode that ships the RecognizeDocumentsRequest SDK."
            exit 1
          fi
          echo "Sidecar present:"
          ls -la librecognize_documents.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            *.dylib
          if-no-files-found: warn

  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - '24'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: pnpm test
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-macOS-windows-binding
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Update npm to latest version to ensure it's support Trusted publishing
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Move artifacts
        run: pnpm artifacts
      - name: Place darwin sidecar dylibs
        run: |
          # Strictness mirrors the publish step's release detection: missing
          # sidecar is a hard error only when this commit would actually
          # publish a release/prerelease, so non-release pushes don't fail
          # late because of toolchain skew in the build job.
          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -qE "^v?[0-9]+\.[0-9]+\.[0-9]+"; then
            strict=1
          else
            strict=0
          fi
          for target in darwin-arm64 darwin-x64; do
            cargo_target_name="$(echo "$target" | sed -e 's/darwin-arm64/aarch64-apple-darwin/' -e 's/darwin-x64/x86_64-apple-darwin/')"
            if [ -f "artifacts/bindings-${cargo_target_name}/librecognize_documents.dylib" ]; then
              cp "artifacts/bindings-${cargo_target_name}/librecognize_documents.dylib" "npm/${target}/"
              echo "Placed dylib in npm/${target}/"
              node -e "
                const fs = require('fs');
                const p = 'npm/${target}/package.json';
                const j = JSON.parse(fs.readFileSync(p, 'utf8'));
                j.files = Array.from(new Set([...(j.files || []), 'librecognize_documents.dylib']));
                fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
              "
            elif [ "$strict" = "1" ]; then
              echo "::error::No sidecar dylib for ${target}; refusing to publish Darwin package without it"
              exit 1
            else
              echo "::warning::No sidecar dylib for ${target}; a real release on this commit would fail"
            fi
          done
        shell: bash
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          if git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
