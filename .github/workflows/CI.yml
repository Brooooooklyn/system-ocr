name: CI
env:
  DEBUG: napi:*
  APP_NAME: system-ocr
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy

  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm build --target x86_64-apple-darwin
          - host: windows-latest
            build: pnpm build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: pnpm build --target aarch64-pc-windows-msvc
    name: stable - ${{ matrix.settings.target }} - node@24
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Select Xcode 26 if available (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # macos-latest currently maps to macOS 15 with Xcode 16.4 selected
          # by default. Xcode 26 is pre-installed on the runner image but not
          # selected. Select the newest installed Xcode 26.x so the macOS 26
          # SDK (RecognizeDocumentsRequest) is visible to swiftc and the
          # cargo build below.
          newest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest/Contents/Developer"
            echo "Selected $newest"
          else
            echo "No Xcode 26 installation found; falling back to runner default"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcrun --sdk macosx --show-sdk-version
      - name: Get Xcode SDK version (macOS)
        id: xcode_sdk
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo unknown)"
          echo "sdk_version=$sdk" >> "$GITHUB_OUTPUT"
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          # On macOS the Swift sidecar output depends on the installed SDK
          # version; bust the cache when the SDK changes so build.rs reruns
          # and re-emits `librecognize_documents.dylib`.
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}${{ runner.os == 'macOS' && format('-sdk{0}', steps.xcode_sdk.outputs.sdk_version) || '' }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Stage Darwin sidecar dylib
        if: contains(matrix.settings.target, 'apple-darwin')
        shell: bash
        run: |
          # build.rs copies the sidecar to the workspace root as a side
          # effect, but cargo may skip rerunning the build script when
          # restoring from cache. Stage the dylib here from the canonical
          # cargo target dir so the artifact-upload step has a stable input
          # regardless of cache state.
          src="target/${{ matrix.settings.target }}/release/librecognize_documents.dylib"
          if [ -f "$src" ]; then
            cp "$src" ./
            echo "Staged sidecar from $src"
            # Validate it matches the build matrix architecture.
            archs="$(lipo -archs librecognize_documents.dylib 2>/dev/null || file librecognize_documents.dylib)"
            echo "sidecar archs: $archs"
          else
            echo "No sidecar at $src (build.rs may have skipped on missing macOS 26 SDK)"
          fi
      - name: Verify Darwin sidecar built (release commits only)
        if: contains(matrix.settings.target, 'apple-darwin')
        shell: bash
        run: |
          # Fail the build early — not the publish — when a release commit
          # produces no Swift sidecar. The publish job also enforces this,
          # but discovering the gap here surfaces a missing macOS 26 SDK or
          # Xcode toolchain immediately for the people running the build.
          msg="$(git log -1 --pretty=%B)"
          if ! echo "$msg" | grep -qE "^v?[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "Not a release commit; sidecar absence is acceptable."
            exit 0
          fi
          sdk="$(xcrun --sdk macosx --show-sdk-version 2>/dev/null || echo unknown)"
          case "$sdk" in
            26.*) ;;
            *)
              echo "::error::Release commit on ${{ matrix.settings.target }} but selected macOS SDK is $sdk (need 26.x for RecognizeDocumentsRequest). Upgrade the runner image or select Xcode 26."
              exit 1
              ;;
          esac
          if [ ! -f "librecognize_documents.dylib" ]; then
            echo "::error::Release commit on ${{ matrix.settings.target }} produced no librecognize_documents.dylib. The runner needs macOS 26 SDK (Xcode 26+); upgrade the runner image or pin an Xcode that ships the RecognizeDocumentsRequest SDK."
            exit 1
          fi
          echo "Sidecar present:"
          ls -la librecognize_documents.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            *.dylib
          if-no-files-found: warn

  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: arm64
          # Darwin test hosts pin to macOS 26 so the strict sidecar smoke
          # below actually executes every push/PR instead of self-skipping.
          # `macos-26-intel` (x64) and `macos-26` (arm64) are both GA in the
          # actions/runner-images catalog. The build job stays on
          # macos-latest + manually selected Xcode 26; only the runtime
          # exercise needs to be on macOS 26 (Vision/Swift runtime), since
          # the sidecar's `if #available(macOS 26, *)` gate would otherwise
          # short-circuit on macOS 15.
          - host: macos-26-intel
            target: x86_64-apple-darwin
            architecture: x64
          - host: macos-26
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - '24'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: pnpm install
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: pnpm test
      - name: Smoke-test sidecar (macOS 26+ only)
        if: contains(matrix.settings.target, 'apple-darwin')
        shell: bash
        run: |
          # `pnpm test` above runs in non-strict mode, so a broken sidecar
          # that errors on every call would silently mask via legacy
          # fallback. Force the strict path here so the sidecar's runtime
          # success is asserted end-to-end. The build SDK is irrelevant in
          # this job: the artifact was produced by a different job and we
          # never invoke swiftc here. The sidecar's Swift code internally
          # gates on `if #available(macOS 26, *)`, so the test host MUST be
          # macOS 26+ — which is why the matrix above pins macos-26 and
          # macos-26-intel. If a future runner-image change downgrades the
          # host OS, fail loudly here instead of silently skipping the
          # only end-to-end runtime check the dylib gets before publish.
          os="$(sw_vers -productVersion 2>/dev/null || echo unknown)"
          os_major="${os%%.*}"
          if ! [[ "$os_major" =~ ^[0-9]+$ ]] || [ "$os_major" -lt 26 ]; then
            echo "::error::Runner OS $os has no RecognizeDocumentsRequest runtime support, but the matrix host is supposed to be macOS 26+. Did the runner-images label change?"
            exit 1
          fi
          # Map cargo target -> napi-rs platform suffix used in the .node
          # filename emitted by `napi build --target <cargo-target>`.
          case "${{ matrix.settings.target }}" in
            aarch64-apple-darwin) node_file="system-ocr.darwin-arm64.node" ;;
            x86_64-apple-darwin)  node_file="system-ocr.darwin-x64.node" ;;
            *) echo "::error::Unhandled darwin target ${{ matrix.settings.target }}"; exit 1 ;;
          esac
          if [ ! -f "$node_file" ]; then
            echo "::error::Expected $node_file in workspace root after artifact download"
            ls -la
            exit 1
          fi
          if [ ! -f "librecognize_documents.dylib" ]; then
            echo "::error::Expected sidecar dylib next to $node_file after artifact download"
            ls -la
            exit 1
          fi
          SYSTEM_OCR_REQUIRE_DOCUMENTS=1 node -e "
            const ocr = require('./${node_file}');
            ocr.recognize('./example.png').then(r => {
              if (!r.text || r.text.length < 10) {
                console.error('Sidecar returned suspiciously short text:', JSON.stringify(r));
                process.exit(1);
              }
              console.log('Sidecar smoke OK:', r.text.length, 'chars at', r.confidence.toFixed(3), 'confidence');
            }, e => {
              console.error('Sidecar smoke FAILED:', e.message);
              process.exit(1);
            });
          "
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-macOS-windows-binding
    steps:
      - uses: actions/checkout@v7
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Update npm to latest version to ensure it's support Trusted publishing
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: pnpm install
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: create npm dirs
        run: pnpm napi create-npm-dirs
      - name: Move artifacts
        run: pnpm artifacts
      - name: Inject darwin sidecar dylibs
        # Copies librecognize_documents.dylib into each npm/darwin-* package
        # and adds it to that package's `files`. Missing dylib is a hard error
        # only on release commits (the script detects this from the HEAD commit
        # message), so non-release pushes don't fail late on toolchain skew.
        run: node scripts/inject-darwin-sidecar.mjs
        shell: bash
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          if git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^v\?[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
